name: secrets-ldap

# openbao-plugins の secrets/ldap を commit 固定でビルドし、
# ghcr.io/<owner>/openbao-plugin-secrets-ldap:<PLUGIN_VERSION> として配布する。
#
# - pull_request : テスト + バイナリ/イメージのビルドのみ (push しない, 書き込み権限なし)
# - main への push / 手動実行 : 上記に加えてイメージを push し、provenance を付与する
on:
  push:
    branches:
      - main
    paths:
      - secrets-ldap/**
      - .github/workflows/secrets-ldap.yaml
  pull_request:
    paths:
      - secrets-ldap/**
      - .github/workflows/secrets-ldap.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-ldap-${{ github.ref }}
  cancel-in-progress: false

env:
  # OpenBao k3s ノードは全て amd64 のため linux_amd64_v1 のみビルドする。
  TARGET: linux_amd64_v1
  BINARY_NAME: openbao-plugin-secrets-ldap

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      plugin_version: ${{ steps.config.outputs.plugin_version }}
      upstream_ref: ${{ steps.config.outputs.upstream_ref }}
      upstream_repository: ${{ steps.config.outputs.upstream_repository }}
      binary_sha256: ${{ steps.binary.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load upstream.env
        id: config
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . secrets-ldap/upstream.env
          if ! printf '%s' "${UPSTREAM_REF}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::UPSTREAM_REF must be a 40-char commit SHA: ${UPSTREAM_REF}"
            exit 1
          fi
          if [ "${PLUGIN}" != "secrets-ldap" ]; then
            echo "::error::unexpected PLUGIN: ${PLUGIN}"
            exit 1
          fi
          if ! printf '%s' "${PLUGIN_VERSION}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::PLUGIN_VERSION must be semver with leading v: ${PLUGIN_VERSION}"
            exit 1
          fi
          {
            echo "upstream_repository=${UPSTREAM_REPOSITORY}"
            echo "upstream_ref=${UPSTREAM_REF}"
            echo "plugin=${PLUGIN}"
            echo "plugin_version=${PLUGIN_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.config.outputs.upstream_repository }}
          ref: ${{ steps.config.outputs.upstream_ref }}
          path: upstream
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum

      - name: Test (upstream make target, -test.short)
        working-directory: upstream
        run: make ${{ steps.config.outputs.plugin }}-test

      - name: Build (upstream make target)
        working-directory: upstream
        run: |
          make build \
            PLUGIN=${{ steps.config.outputs.plugin }} \
            TARGET=${TARGET} \
            VERSION=${{ steps.config.outputs.plugin_version }}

      - name: Verify and stage binary
        id: binary
        run: |
          set -euo pipefail
          src="upstream/bin/${BINARY_NAME}_${TARGET}"
          file "${src}"
          # CGO_ENABLED=0 の静的バイナリであること (FROM scratch で動かすため)
          file "${src}" | grep -q 'statically linked'
          mkdir -p dist
          cp "${src}" "dist/${BINARY_NAME}"
          sha256=$(sha256sum "dist/${BINARY_NAME}" | cut -d' ' -f1)
          echo "${sha256}  ${BINARY_NAME}" > "dist/${BINARY_NAME}.sha256"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Build image (no push)
        run: |
          set -euo pipefail
          cp "dist/${BINARY_NAME}" secrets-ldap/
          buildah build --format oci --platform linux/amd64 \
            -f secrets-ldap/Containerfile \
            -t "localhost/${BINARY_NAME}:ci" secrets-ldap

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BINARY_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PLUGIN_VERSION: ${{ needs.build.outputs.plugin_version }}
      BINARY_SHA256: ${{ needs.build.outputs.binary_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.BINARY_NAME }}
          path: dist

      - name: Verify binary checksum
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "${BINARY_NAME}.sha256")
          test "$(sha256sum "dist/${BINARY_NAME}" | cut -d' ' -f1)" = "${BINARY_SHA256}"

      - name: Set image name
        id: image
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/${BINARY_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        run: |
          set -euo pipefail
          ref="${{ steps.image.outputs.name }}:${PLUGIN_VERSION}"
          if skopeo inspect --raw "docker://${ref}" >/dev/null 2>&1; then
            echo "::error::${ref} already exists. Bump PLUGIN_VERSION in secrets-ldap/upstream.env."
            exit 1
          fi

      - name: Build and push image
        id: push
        run: |
          set -euo pipefail
          ref="${{ steps.image.outputs.name }}:${PLUGIN_VERSION}"
          chmod 0755 "dist/${BINARY_NAME}"
          cp "dist/${BINARY_NAME}" secrets-ldap/
          buildah build --format oci --platform linux/amd64 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${PLUGIN_VERSION}" \
            --label "io.openbao.plugin.upstream.repository=${{ needs.build.outputs.upstream_repository }}" \
            --label "io.openbao.plugin.upstream.revision=${{ needs.build.outputs.upstream_ref }}" \
            --label "io.openbao.plugin.binary.sha256=${BINARY_SHA256}" \
            -f secrets-ldap/Containerfile -t "${ref}" secrets-ldap
          buildah push --digestfile digest.txt "${ref}" "docker://${ref}"
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          image="${{ steps.image.outputs.name }}"
          digest="${{ steps.push.outputs.digest }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ${BINARY_NAME} ${PLUGIN_VERSION}

          | | |
          |---|---|
          | upstream | \`${{ needs.build.outputs.upstream_repository }}@${{ needs.build.outputs.upstream_ref }}\` |
          | image | \`${image}:${PLUGIN_VERSION}@${digest}\` |
          | binary sha256 | \`${BINARY_SHA256}\` |

          OpenBao plugin stanza (2.6.x / 2.7.x 両対応):

          \`\`\`hcl
          plugin "secret" "ldap" {
            image       = "${image}"
            version     = "${PLUGIN_VERSION}"
            binary_name = "${BINARY_NAME}"
            sha256sum   = "${BINARY_SHA256}"
          }
          \`\`\`
          EOF
